    status: "LB regime; two sources agree on ~30 uM onset"
  k_dam:
    value: 1.0
    status: "unsourced; k_dam/A_tox non-identifiable --- only the ratio is determined"
  k_rep0:
    value: 0.1
    status: "unsourced; k_dam/A_tox non-identifiable --- only the ratio is determined"
  w:
    value: 1.0
    status: "insensitive (PRCC -0.02)"

# Part III — Gold biorecovery chain. Source: model.md v3.0 section 7.
# Values and status text transcribed verbatim. Nothing corrected.
# Unit system: uM, hours, g/L.

meta:
  part: III
  source: docs/source/model.md
  version: "v3.0 (2026-08-04)"
  concentration_unit: uM
  time_unit: h

V1_capture:
  mu:
    value: 0.70
    status: standard E. coli
  Xmax:
    value: 5.0
    unit: g/L
    status: standard E. coli
  X0:
    value: 0.05
    unit: g/L
    status: standard E. coli
  m:
    value: 0.005
    status: standard E. coli
  q_max:
    value: 4.4
    unit: uM/(g/L)

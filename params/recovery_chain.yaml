  k1:
    value: 5.0e-5
    unit: h^-1
    status: "weakly calibrated --- joint #1 driver"
    flag: warning
  k2:
    value: 0.2
    unit: uM^-1.h^-1
    status: "weakly calibrated --- joint #1 driver"
    flag: warning
  k_ox:
    value: 0.02
    unit: h^-1
    status: "unsourced; measurable (air vs N2)"
  k_rech:
    value: 0.1
    status: insensitive
  K_i:
    value: 500
    status: insensitive
  R0:
    value: null
    range: [10, 1000]
    unit: uM

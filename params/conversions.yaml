# Unit-conversion constants used only inside src/interfaces.py.
#
# These do not appear in any of the three source documents. They are needed
# because the documents are written in different unit systems, and a joint
# cannot be made without them. They are listed here, with sources, rather
# than hidden as literals in the adapter code.

meta:
  purpose: "Constants required by the two joints. Not from the source documents."

N_A:
  value: 6.02214076e+23
  unit: mol^-1
  meaning: Avogadro constant
  status: exact
  source: "SI definition"

cells_per_g_dry_weight:
  value: 2.36e+12
  unit: cells/g
  meaning: E. coli cells per gram dry weight
  status: sourced
  source: "[S30] Dennis & Bremer via BioNumbers; interpolated at our own mu"
  derivation: >-
    Dry mass per cell varies more than 5-fold with growth rate: 148 fg at a
    100 min doubling time, 865 fg at 24 min [S30]. Faster cells are bigger.
    Interpolating log-linearly in growth rate at our mu = 1.2 /h, a 34.7 min
    doubling, gives 423 fg per cell and 1/423e-15 = 2.36e12 cells/g.
  corrected_2026_08_11: true
  superseded:
    value: 3.57e+12
    basis: "single-cell dry mass 0.28 pg = 280 fg"
    reason: >-
      280 fg is a SLOW-GROWTH value, near the 148 fg end of the range. Applying
      it to a culture the model runs at a 35 min doubling overstated q_max and
      Vmax by 1.51x. Found by the source audit, ISSUES.md item 33.
  caveat: >-
    Still an interpolation from a literature curve, not a measurement of our
    own culture. One OD600 curve plus one dry-weight measurement removes this
    constant entirely, and that is the recommended fix.
  note: >
    Sensitive to growth rate. Cell dry mass ranges roughly 0.2-0.5 pg across
    growth conditions, so this constant alone carries a factor of about 2.5.
    Part III uses X in g/L, Part II uses molecules/cell; this is the only
    bridge between them.

minutes_per_hour:
  value: 60
  unit: min/h
  meaning: Part I and Part II run in minutes; Part III runs in hours.
  status: exact
  source: null

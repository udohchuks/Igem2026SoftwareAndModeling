# ===========================================================================
# EVERYTHING BELOW WAS ADDED 2026-08-12.
# These blocks did not exist before. They carry the feed basis, the broth
# recipe, the oxygen level, the three-vessel operating choices and the proton
# balance, all from Part I's sequential model. See ISSUES.md item 35.
# ===========================================================================

# What is actually in the reactor. The old file had rho_Au and rho_Cu but no
# metal masses, so no area or inventory could be computed from it alone.
feed_basis:
  pcb_loading:
    value: 100
    unit: g/L
    meaning: Crushed printed circuit board powder per litre of liquor
    status: operating_choice
    note: "10 % pulp density."
    source: "docs/source/sequential_2026-08-12/"
  m_Au:
    value: 2.0e-5
    unit: kg
    meaning: Gold on the boards, per litre of liquor
    status: sourced
    note: >-
      20 mg, being 0.02 wt% of 100 g of board. A typical assay. Gives
      n_Au(0) = 101.5 umol at M_Au = 196.97 g/mol.
    source: "docs/source/sequential_2026-08-12/, typical PCB assay"
  m_Cu:
    value: 3.0e-2
    unit: kg
    meaning: Copper on the boards, per litre of liquor
    status: sourced
    note: >-
      30 g, being 30 wt% of 100 g of board. Gives n_Cu(0) = 472069 umol at
      M_Cu = 63.55 g/mol, a copper to gold molar ratio of 4649 to 1.
      Copper is quantitatively irrelevant as a product and decisive as a
      reagent sink: 0.18 % of it dissolving is enough to destroy the whole
      thiosulfate charge.
    source: "docs/source/sequential_2026-08-12/, typical PCB assay"
  M_Au:
    value: 0.19697
    unit: kg/mol
    meaning: Molar mass of gold
    status: sourced
    source: "IUPAC standard atomic weight"
  M_Cu:
    value: 0.06355
    unit: kg/mol
    meaning: Molar mass of copper
    status: sourced
    source: "IUPAC standard atomic weight"

# The leachant is not synthesised from nothing. It is a bought broth whose
# composition fixes two initial conditions. This derivation is new information
# from the sequential write-up, not a modelling choice.
broth:
  derivation: >-
    The 46 g/L base powder contains 30 g/L Na2S2O3.5H2O and NO tetrathionate.
    Tetrathionate is generated in situ when the iodine solution, 6 g I2 plus
    5 g KI in 20 mL, is added at the point of use:
        I2 + 2 S2O3^2- -> 2 I- + S4O6^2-
    Iodine is limiting, so only part of the thiosulfate is converted.
        30 g/L / 248.18 g/mol   = 120.88 mmol thiosulfate
        6 g    / 253.81 g/mol   =  23.64 mmol iodine
    in a final 1.02 L:
        S4O6 = 23.64 / 1.02              = 23.2 mM
        S2O3 = (120.88 - 47.28) / 1.02   = 72.1 mM
    Reproduced to three significant figures by the audit, ISSUES.md item 35.
  S4O6_initial:
    value: 23200
    unit: umol/L
    meaning: Tetrathionate charged, from the iodine addition
    status: derived_from_recipe
    source: "docs/source/sequential_2026-08-12/, Stage 2 feed composition"
  S2O3_initial:
    value: 72100
    unit: umol/L
    meaning: Thiosulfate left unconverted in the broth
    status: derived_from_recipe
    note: >-
      This is NOT a model output. Three quarters of the leachant is present
      before the enzyme does anything.
    source: "docs/source/sequential_2026-08-12/, Stage 2 feed composition"

oxygen:
  O2:
    value: 500
    unit: umol/L
    meaning: Dissolved oxygen, held constant
    status: operating_choice
    note: >-
      Sparged and held, so f_O2 = 0.91 throughout and never limits anything.
      This is an assumption, not a result. A real reactor would show depletion
      during peak copper oxidation. Part I's author says so in his Limitations
      section. There is no mass-transfer term in either model.
    source: "docs/source/sequential_2026-08-12/"
  O2_dynamic:
    value: false
    meaning: Whether dissolved oxygen is a state fed by the air pump
    status: operating_choice
    note: >-
      Added 2026-08-19 from v5's Intervention 1. FALSE by default, so nothing
      already reported moves. With it true, O2 stops being an imposed constant
      and becomes a balance between pump supply and the reactions that use it.
      This is the change v5 gets the most from, and this repository already
      agreed with it from the other direction: the constant-O2 sweep has an
      interior optimum near 80 umol/L, far below the imposed 500.
    source: "docs/source/Bioleaching_Models_v5.docx, Intervention 1"
  kLa:
    value: 1.68
    unit: min^-1
    meaning: Volumetric oxygen mass-transfer coefficient
    status: derived_from_correlation
    note: >-
      Van't Riet non-coalescing correlation, kLa = 0.002 (P/V)^0.70 u_g^0.20,
      with P/V = 307.2 W/m^3 and u_g = 1.06e-3 m/s. Both derive from the
      equipment numbers below.
      IT IS A CORRELATION FITTED ON OTHER PEOPLE'S VESSELS, not a measurement
      of this one. A gassing-out experiment would replace it and should. v5
      says so itself in its assumptions.
      The non-coalescing form is chosen because a 94 mM thiosulfate liquor is
      full of dissolved ions, which stop bubbles merging.
    source: "[Van't Riet 1979]; equipment values in v5 Intervention 1"
  C_star:
    value: 259
    unit: umol/L
    meaning: Dissolved-oxygen saturation concentration, air, 25 C
    status: sourced
    note: >-
      Air-saturated water at 25 C with a small salting-out correction.
      Cross-checked against Henry's law, k_H = 769 L.atm/mol.
      NOTE IT IS BELOW THE IMPOSED 500. The old constant-O2 baseline was not
      merely an assumption, it was ABOVE what air can dissolve at all. Only
      pure-oxygen sparging reaches 500. Switching O2_dynamic on therefore
      lowers oxygen for two separate reasons, and both of them help.
    source: "APHA Standard Methods DO tables"
  O2_initial:
    value: 259
    unit: umol/L
    meaning: Dissolved oxygen at the start of the leach
    status: operating_choice
    note: "Air-saturated at t = 0, i.e. C_star. The liquor sits in air first."
    source: "docs/source/Bioleaching_Models_v5.docx, Intervention 1"

# The ligand that stops Cu(II) destroying the leachant.
# Chosen 2026-08-19: glycine, not ammonia. ISSUES.md item 54.
ligand:
  gly_on:
    value: false
    meaning: Whether glycine speciation suppresses the parasitic reaction
    status: operating_choice
    note: >-
      FALSE by default, so nothing already reported moves. Requires G_T,
      eps_gly and pH_balance.pH_set, and raises without them.
    source: "team decision 2026-08-19"
  G_T:
    value: null
    unit: umol/L
    meaning: Total glycine charged to the leach vessel
    status: operating_choice
    note: >-
      Held null because the dose is not chosen. The published glycine-
      thiosulfate work uses about 0.27 M, i.e. 2.7e5 in this file's unit, and
      that is the figure the recommendation in ISSUES.md item 54 was computed
      at. It is a starting point for a sweep, not a set point.
    source: null
  eps_gly:
    value: null
    unit: dimensionless
    meaning: >-
      Reactivity of copper glycinate toward thiosulfate, RELATIVE to free
      Cu(2+). 1.0 means glycine does nothing; 0.0 means the complex is inert.
    status: unmeasured
    note: >-
      HELD NULL DELIBERATELY. This one number sets the entire size of the
      glycine benefit and NOBODY HAS MEASURED IT. Its consequence is published
      but not the constant itself: thiosulfate consumption falls from 5.2 to
      2.2 g/L when glycine is added, a 58 % reduction. Calibrating against
      that observable, and never against gold, gives about 0.012.
      Re-calibrating under five different operating conditions gives 0.0024 to
      0.0421, a 17x spread, so the single-constant form is an approximation.
      The RECOMMENDATION survives the whole band; the NUMBER does not. Quote
      the band, never the point.
      Two caveats. The 5.2 to 2.2 g/L measurement is on an auriferous ORE with
      copper dosed at 5 mM, while a waste PCB is 30 wt% copper and makes its
      own continuously. And the published work runs at 30 to 60 C while this
      model is isothermal at 25 C.
      The wet lab can pin it in one experiment: two leaches, same feed, same
      pH, one with glycine and one without, thiosulfate assayed at 6, 24, 48 h.
    source: null
  pKa2_gly:
    value: 9.78
    unit: dimensionless
    meaning: Second acid dissociation constant of glycine, NH3+CH2COO- / Gly-
    status: sourced
    note: >-
      Gly- is the chelating form, so this is why every glycine-thiosulfate
      paper reports a pH 9.3 to 10.5 window and why the leach cannot run
      below about 9.3. It is the mechanistic explanation for ISSUES.md item
      23's pH window, which had none before.
      Gly- fraction: 0.25 at pH 9.3, 0.62 at 10.0, 0.77 at 10.3, 0.84 at 10.5.
      The gain flattens above 10.3, which is one of the three reasons not to
      push the pump higher.
    source: "standard, 25 C"
  logB1_CuGly:
    value: 8.62
    unit: dimensionless
    meaning: log beta1 for Cu(2+) + Gly- -> CuGly+
    status: sourced
    note: "Standard stability constant, 25 C, I = 0.1."
    source: "IUPAC stability constant compilations"
  logB2_CuGly:
    value: 15.64
    unit: dimensionless
    meaning: log beta2 for Cu(2+) + 2 Gly- -> Cu(Gly)2
    status: sourced
    note: >-
      Standard stability constant, 25 C, I = 0.1. At 0.27 M glycine and pH 10
      the beta2 term dominates and free Cu(2+) is suppressed by about six
      orders of magnitude, which is why eps_gly and not alpha_free is what
      decides the answer.
    source: "IUPAC stability constant compilations"

# The three-vessel process.
sequential:
  note: >-
    Stage 1 grows cells and harvests TetH. Stage 2 mixes purified TetH with
    tetrathionate broth. Stage 3 charges the product liquor onto crushed PCB.
    Only Stage 2 and Stage 3 have differential equations. Stage 1 is an
    algebraic steady state.
  E_stage2:
    value: 0.043
    unit: umol/L
    meaning: Purified TetH charged into the conversion vessel
    status: design_choice
    note: >-
      A FREE DESIGN VARIABLE, which is the whole point of purifying. It is set
      by how much culture you are willing to grow, not by cell density.
      0.043 gives 95.9 % conversion in 3 days and needs 9.1 L of culture per
      litre of vessel. 0.129 finishes in 1 day and needs 27 L. The in-situ
      value 4.75e-3 would take about 27 days.
      This is why the Vmax disagreement between this repository and Part I
      does not reach the leach result: Stage 3 contains no enzyme, and Stage 2
      is charged to whatever level is chosen. See ISSUES.md item 35.
    source: "docs/source/sequential_2026-08-12/, Stage 2"
  E_stage3:
    value: 0.043
    unit: umol/L
    meaning: Enzyme in the leach vessel, only if deliberately carried over
    status: design_choice
    note: "Used only when carry_enzyme is true."
    source: "docs/source/sequential_2026-08-12/, Stage 3"
  carry_enzyme:
    value: false
    meaning: Whether enzyme is transferred with the liquor into Stage 3
    status: operating_choice
    note: >-
      False by default: purified enzyme stays in the conversion vessel.
      Setting it true recycles the dead-end tetrathionate that the parasitic
      reaction makes, and raises gold recovery at 72 h from 28.5 % to 33.7 %,
      leaving 276 umol/L of thiosulfate unspent instead of none.
      That is the largest single process gain in the model and it costs one
      pipe. It also puts the enzyme back into the pH conflict of ISSUES.md
      item 37. Not adopted; recorded for the team.
    source: "docs/source/sequential_2026-08-12/, compare_carryover"
  t_stage2:
    value: 4320
    unit: min
    meaning: Conversion vessel duration, 3 days
    status: operating_choice
    source: "docs/source/sequential_2026-08-12/"
  t_stage3:
    value: 4320
    unit: min
    meaning: Leach vessel duration, 3 days
    status: operating_choice
    note: >-
      The author recommends 1 day, not 3. Days two and three add 3.4
      percentage points of gold. Value kept at 3 days so the model still
      shows the plateau; see ISSUES.md item 21 for the missing stopping rule.
    source: "docs/source/sequential_2026-08-12/"
  purification_yield:
    value: null
    unit: dimensionless
    meaning: Fraction of harvested TetH that survives extraction and purification
    status: missing
    note: >-
      NOT MODELLED ANYWHERE. Stage 1 assumes every enzyme molecule in the
      culture reaches the conversion vessel. Real purification recovers
      perhaps 0.3 to 0.6. The quoted 9.1 L of culture per litre is therefore a
      floor, not an estimate. ISSUES.md item 39.
    source: null
  enzyme_half_life_stage2:
    value: null
    unit: min
    meaning: Thermal or chemical decay of purified TetH in the conversion vessel
    status: missing
    note: >-
      NOT MODELLED. Stage 2 holds the enzyme concentration constant for 4320
      minutes. k_deg was dropped along with the cells, but proteolysis is not
      the only loss route. ISSUES.md item 39.
    source: null

# Proton balance. Alkalinity, never free [H+]. See the note.
pH_balance:
  form:
    value: alkalinity
    status: team_decision
    note: >-
      Adopted 2026-08-12. Tracking free [H+] fails here by construction: net
      base production is about 1e5 umol/L over a run while the free proton
      pool at pH 7 is 0.1 umol/L, so [H+] is driven negative and pH diverges.
      The retired one-pot model also divided its proton rate by (1 + beta)
      with beta in umol/L, which is dimensionally inconsistent. The sequential
      model tracks alkalinity, which is the standard treatment and is correct.
      Only the alkalinity form is implemented. ISSUES.md item 37.
  beta:
    value: 1.0e+5
    unit: umol/L per pH unit
    meaning: Lumped buffer capacity
    status: calibrate
    note: "About a 0.1 M carbonate buffer. Lower it and the pH swing grows."
    source: null
  pH0:
    value: 7.0
    unit: dimensionless
    meaning: Starting pH of the leach liquor
    status: operating_choice
    note: >-
      The leach chemistry in the sources is published at pH 9 to 10.5, not 7.
      ISSUES.md item 23 is unaffected by this file and still open.
    source: "docs/source/sequential_2026-08-12/, Stage 3"
  pH_on:
    value: false
    meaning: Whether the proton balance is integrated
    status: operating_choice
    note: >-
      False in Part I's model, which means the pH panel of his Figure 2 is a
      flat line at 7.0 by construction and not a result. Switching it on gives
      a final pH of 7.94 at beta = 1e5. Kept false so this repository
      reproduces his figure; switch it on deliberately. ISSUES.md item 36.
    source: "docs/source/sequential_2026-08-12/, Stage 3"
  pH_control:
    value: false
    meaning: Whether a dosing pump holds pH at pH_set
    status: operating_choice
    note: >-
      Added 2026-08-19. The team has a pH sensor and a dosing pump, so pH is
      an INPUT to the real vessel, not an output. With this true, pH is held
      at pH_set, the alkalinity state stops moving, and the model reports
      TITRANT DEMAND instead: how much net base or acid the pump must deliver
      to hold the set point. That is the quantity the equipment actually
      produces, and the quantity a reagent budget needs.
      FALSE by default, so nothing already reported moves.
      It also removes a dependence on beta, which carries status calibrate and
      no source. With the pump on, the buffer capacity does not enter.
    source: "team equipment, 2026-08-19"
  pH_set:
    value: null
    unit: dimensionless
    meaning: The pH the dosing pump holds
    status: operating_choice
    note: >-
      HELD NULL because the set point is not chosen. Choosing it is the call,
      and the model raises rather than pick one.
      THE WINDOW IS 9.3 TO 10.5, and the recommendation is 10.0 to 10.3.
      Floor 9.3: below it thiosulfate decomposes and Gly- is under a quarter
      dissociated.
      Ceiling 10.5, for three separate reasons, none of them gold:
        1. the tetrathionate return leg makes 2 trithionate per 5 thiosulfate,
           so faster recycling also means faster permanent sulfur loss
        2. the Gly- fraction flattens, 0.77 at 10.3 against 0.94 at 11.0
        3. Cu(OH)2 precipitates above about 10.5 and passivates the particles
      Gold dissolution is reported FLAT over pH 9 to 11, so none of the pH
      argument is about gold. pH is chosen for lixiviant survival.
      Not yet checked: what pH the GolB capture stage tolerates. If it needs
      below 9 the two stages conflict. ISSUES.md item 23.
    source: null

# Numerical settings. Not chemistry. Kept here rather than as literals in
# src/leach.py, because AGENTS.md rule 2 admits no number into a .py file.
numerics:
  exhaustion_smoothing_fraction:
    value: 1.0e-4
    unit: dimensionless
    meaning: >-
      Width of the smooth 0-to-1 switch at metal exhaustion, as a fraction of
      the initial inventory. Replaces a hard if-statement that stalls a stiff
      solver.
    status: numerical_choice
    note: >-
      Taken from Part I's smooth_step. With this in place the terminal-event
      workaround in simulate() is no longer needed for the sequential path.
    source: "docs/source/sequential_2026-08-12/, smooth_step"


# ---------------------------------------------------------------------------
# THE TWO LIGAND SCENARIOS
#
# v5 presents Stage 3 twice, "WITH AMMONIA [266 mM]" and "WITHOUT AMMONIA
# [0 mM]". That comparison answers the wrong question for this project: nobody
# proposed running with no ligand at all. Copper destroys 98 % of the charge
# either way, so "without ammonia" is not an option, it is the failure mode.
#
# The decision actually in front of the team is WHICH LIGAND. So the same two
# sections are kept, and the second one is glycine rather than nothing.
#
# BOTH RUN AT THE SAME OPERATING POINT. Same pH, same aeration, same crush,
# same batch time. Every difference between the two columns is the ligand and
# nothing else, which is the only way a comparison is worth printing.
#
# THE COMPARISON IS DELIBERATELY GENEROUS TO AMMONIA, in three ways:
#
#   1. Ammonia is volatile and the air pump strips it. Above pH 9.25 ammonia
#      is mostly free NH3, and sparging air through alkaline ammoniacal liquor
#      is the standard method for driving ammonia out of water. The ammonia
#      column assumes NONE of that happens, because no stripping rate has been
#      measured for this vessel. Its numbers are an upper bound.
#   2. Ammonia keeps its own measured constants, k_Au_Cu = 1500 and
#      k_par = 1.0e-5, which are the best-characterised numbers in Part I.
#      Glycine's decisive constant is not measured at all.
#   3. k_ox_Cu is ammoniacal in BOTH columns, because no ammonia-free value
#      exists. Ammonia slows Cu(I) re-oxidation, so the true ammonia-free
#      value is probably larger, which would mean more Cu(II) and a LARGER
#      benefit from glycine. The bias runs against glycine, not for it.
#
# If glycine still wins under all three handicaps, the conclusion is safe.
#
# `src/leach.py::scenario` reads this block.
# ---------------------------------------------------------------------------
scenarios:
  meta:
    operating_point:
      note: >-
        Applied to both columns before the ligand overrides below. pH held by
        the dosing pump at the recommended set point; oxygen supplied by the
        air pump rather than imposed; the alkaline return leg open, which is
        the only thing that makes pH a lever at all.
      values:
        pH_control: true
        pH_set: 10.0
        alkaline_decay_on: true
        O2_dynamic: true
  ammonia:
    label: "Ammonia, 266 mM"
    status: reference_only
    note: >-
      NOT THE TEAM'S CHOICE. Retained so the comparison has a baseline and so
      v5's ammoniacal section stays reproducible. Ammonia holds Cu(II) as the
      cupric-tetraammine complex, which is a strong enough oxidant to make the
      Cu(II) route carry gold, hence k_Au_Cu = 1500. It cannot be deployed at
      Agbogbloshie, it needs fume control, and the air pump would remove it.
    overrides:
      k_Au_Cu: 1500
      k_par: 1.0e-5
      gly_on: false
    source: "[11] Aylmore & Muir 2001; [12] Maharaj 2024; [6] Byerley 1973"
  glycine:
    label: "Glycine, 0.27 M"
    status: team_choice
    note: >-
      ADOPTED 2026-08-19. ISSUES.md item 54. Glycine holds Cu(II) as copper
      glycinate. The complex still oxidises gold, while free Cu(2+), the
      species that attacks thiosulfate, is suppressed to about 8e-15 of the
      pool at pH 10. That asymmetry is the whole mechanism.
      Non-volatile, so the air pump cannot remove it and pH and airflow stay
      independent knobs. Food grade and biodegradable.
    overrides:
      k_Au_Cu: 21.0
      k_par: 1.20e-5
      gly_on: true
      G_T: 2.7e+5
    eps_gly_band:
      value: [0.0024, 0.0116, 0.0421]
      status: calibrated_against_a_published_consequence
      note: >-
        NOT A MEASUREMENT, AND NOT ONE NUMBER. eps_gly is unmeasured. What is
        published is its consequence: thiosulfate consumption falls from 5.2 to
        2.2 g/L when glycine is added, a 58 % reduction. Calibrating against
        that observable, and never against gold, gives 0.0116. Re-calibrating
        under five different operating conditions gives 0.0024 to 0.0421, a
        17x spread.
        THE SCENARIO THEREFORE REPORTS A BAND, low / mid / high, and every
        gold figure in it is a PREDICTION, because gold was not used in the
        calibration. Quote the band. Never quote the midpoint alone.
        ligand.eps_gly itself stays null, so a run that forgets to choose from
        this band raises rather than picking one.
      source: "calibrated 2026-08-19 against the 5.2 -> 2.2 g/L observable"
    source: "ISSUES.md item 54"

# ---------------------------------------------------------------------------
# REPRODUCING THE 2026-08-12 SOURCE DOCUMENT
#
# Three constants changed on 2026-08-19 when the team chose glycine over
# ammonia (ISSUES.md item 54). The write-up in
# docs/source/sequential_2026-08-12/ still prints the ammoniacal numbers, and
# it is a source document, so it is never edited. This block holds the values
# that reproduce it, so the reproduction survives every later change.
#
# `src/leach.py::source_2026_08_12_overrides` reads it.
# `tests/test_leach.py::test_sequential_reproduces_the_numbers_part_I_reports`
# is the test that would otherwise have had to be weakened.
#
# DO NOT use these for a prediction. They describe an ammoniacal reactor.
# ---------------------------------------------------------------------------
reproduction_2026_08_12:
  k_Au_Cu:
    value: 1500
    unit: umol.m^-2.min^-1
    meaning: Gold rate constant, Cu(II) route, ammoniacal
    status: retired_reproduction_only
    source: "[11] Aylmore & Muir 2001; [12] Maharaj 2024"
  k_par:
    value: 1.0e-5
    unit: L.umol^-1.min^-1
    meaning: Parasitic rate constant, ammoniacal
    status: retired_reproduction_only
    source: "[6] Byerley 1973; [7] Breuer & Jeffrey 2003"
  K_S2O3:
    value: 3900
    unit: umol/L
    meaning: Thiosulfate half-saturation, reciprocal-band midpoint
    status: retired_reproduction_only
    source: "[18] Senanayake 2005"

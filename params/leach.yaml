  # The source table is unchanged; it still lists k3 "approx equal to k1".
  k_ox_Cu:
    value: 1.0e-4
    unit: L.umol^-1.min^-1
    meaning: Cu(I) re-oxidation rate constant
    status: sourced_by_proxy

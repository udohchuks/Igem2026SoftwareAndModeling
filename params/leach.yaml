# Part I — Bioleaching. Source: "Bioleaching Models.docx".
# Values transcribed verbatim from the parameter tables. Nothing corrected.
# status: sourced | calibrate | operating_choice | unmeasured | geometry
# Unit system: umol/L, minutes, mol, m, m^2.
#
# ---------------------------------------------------------------------------
# PART I IS THE THREE-VESSEL SEQUENTIAL PROCESS.
#   Stage 1  culture vessel      grow cells, harvest and purify TetH
#   Stage 2  conversion vessel   purified TetH + tetrathionate broth
#   Stage 3  leach vessel        thiosulfate liquor + crushed board
#
# A one-pot design was also written. It was RETIRED on 2026-08-12 and nothing
# in src/ implements it any more. Its write-up and MATLAB file stay unchanged
# in docs/source/sequential_2026-08-12/ so the record survives.
#
# The sequential model supplied a value for every parameter this file carried
# as `value: null`. Each one below now holds that value, with its source, and
# with anything it superseded kept beside it. The audit that cleared them is
# ISSUES.md item 36; it reproduced fourteen of fourteen reported numbers and
# confirmed that sulfur, copper and gold all balance.
#
# The author's `'split'` stoichiometry is chemically identical to this
# repository's stoichiometry="balanced". Two authors fixed ISSUES item 18 the
# same way, independently.
# ---------------------------------------------------------------------------

meta:
  part: I
  source: docs/source/Bioleaching Models.docx
  source_sequential: docs/source/sequential_2026-08-12/Bioleaching_Models_Sequential.docx
  concentration_unit: umol/L
  time_unit: min
  architecture:
    value: sequential
    status: team_decision
    note: >-
      Three vessels, adopted 2026-08-12 as the Part I process. The one-pot
      design is retired and no longer implemented. ISSUES.md item 36.
    retired_2026_08_12:
      value: simultaneous
      source: docs/source/sequential_2026-08-12/Bioleaching_Models_Simultaneous.docx
      reason: >-
        Needed TetH to fold and turn over on a living E. coli surface at pH 7,
        which the literature says it does not do. ISSUES.md item 32. The
        three-vessel design refolds the enzyme outside the cell, which is the
        published procedure.

# ---------------------------------------------------------------------------
# enzyme_capacity is NOT a transcription of the source table. It is this
# repository's replacement for the k_syn x k_cat pair, which no measurement can
# separate. See ISSUES.md item 13. The transcribed originals are kept below,
# unchanged, under enzyme_production.k_syn and tetrathionate.k_cat.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# REBUILT 2026-08-11. The team confirmed E. coli is the organism throughout,
# and that the thiosulfate is made by that E. coli, not bought.
#
# The previous version of this block derived Vmax from Eccleston & Kelly's
# growth yield and maintenance coefficient for Acidithiobacillus ferrooxidans.
# That argument only works for an organism whose whole energy budget runs
# through tetrathionate. E. coli's does not. Those numbers are retired below,
# unchanged, under retired_A_ferrooxidans_route.
#
# The route now is the one that fits an engineered host:
#     Vmax = k_cat * [TetH]
# with k_cat from tetrathionate.k_cat and [TetH] from Part II's expression
# cascade pointed at TetH instead of GolB. See ISSUES.md item 30.
# ---------------------------------------------------------------------------
enzyme_capacity:
  # !! BLOCKING, 2026-08-11. ISSUES.md item 32.
  # Four papers report that TetH expressed in E. coli forms INACTIVE inclusion
  # bodies, and that activity is recovered only by refolding at pH 4 in vitro.
  # Its catalytic optimum is pH 3.0 and its mechanism needs a protonated
  # Asp325, so it cannot turn over at the pH E. coli lives at.
  # Every number in this block assumes TetH folds and works on an E. coli
  # surface at pH ~7. The literature says it does not.
  # TREAT Vmax BELOW AS UNVALIDATED until the team answers item 32.
  organism:
    value: Escherichia coli
    status: team_decision
    note: "Confirmed 2026-08-11. Same organism in Parts I, II and III."
  route:
    value: expression
    status: team_decision
    note: >-
      Vmax = k_cat * [TetH]. Computed by
      src/leach.py :: vmax_from_expression(teth_per_cell, cells_per_L, k_cat).
  teth_per_cell:
    value: 23301
    unit: molecules/cell
    meaning: Active TetH displayed per cell at steady state
    status: derived_from_part_II
    note: >-
      CHANGED 2026-08-19 from 2749 with Part II's copy number, N = 20 -> 300.
      IT SIZES THE CULTURE AND NOTHING ELSE. Stage 2 and Stage 3 do not read
      it; gold at 72 h is identical to 4 decimal places either way. What it
      changes is the largest capital item in Part I: about 2.35 L of culture
      per litre of conversion vessel becomes about 0.28 L.
      CORRECTED 2026-08-21. Both of those ratios were computed at biomass
      1.7 g/L, which this file left behind; at the 4.0 g/L below the live route
      needs 0.12 L per litre. REVIEW.md 2.1 still sizes the culture on the
      retired k_syn route and gets 9.1 L, 77x more. Neither proxy has been
      measured for TetH. ISSUES.md item 68; pinned by tests/test_leach.py ::
      test_two_enzyme_routes_disagree_77x.
      THE BACKBONE IS NOW CONFIRMED FOR TetH TOO. This note said the opposite
      until 2026-08-20, when the team named the vector: TetH and GolB are both
      on pJUMP24-1A(sfGFP), OriV #4, pRO1600/ColE1, high copy. The two
      constructs share one plasmid, so N = 300 is not an assumption carried
      over from GolB, it is the same number for the same backbone.
      WHAT THE SHARED VECTOR DOES NOT FIX. pJUMP24-1A is a Level 1 acceptor:
      the promoter and RBS are inserted parts, so alpha and beta may still
      differ between the two constructs. The backbone fixes N and the host.
      ISSUES.md item 67.
    superseded:
      value: 2749
      reason: >-
        Part II's cascade at N = 20, the pBR322-like assumption. Retired
        2026-08-19 when the wet lab confirmed a pUC-type backbone for GolB.
    derivation: >-
      Part II's cascade run with TetH in place of GolB. P_s = 46602 molecules
      per cell from the ODE, times f = 0.5 folded and active. Every cascade
      parameter except f is generic to the host and the display scaffold, not
      to GolB: alpha promoter, N plasmid copies, beta RBS, k_sec scaffold,
      delta_m, delta_c, delta_s, mu.
    caveat: >-
      f = 0.5 is Part II's fitted folding fraction for GolB. For TetH the
      published expectation at neutral pH is NOT 0.5 but close to zero: it
      aggregates into inclusion bodies in E. coli and needs acid refolding.
      f scales Vmax linearly, so Vmax is not a lower bound. See ISSUES.md
      item 32, which supersedes the softer wording of item 30.
    source: "params/expression.yaml; src/expression.py :: simulate"
  localisation:
    value: surface_displayed
    status: design_choice
    note: >-
      TetH must meet tetrathionate in the bulk liquid, so P_s is used, not the
      cytoplasmic pool P_c = 1454. Native TetH in A. ferrooxidans is
      periplasmic, so this matches its natural compartment. If TetH is instead
      left cytoplasmic, use P_c and add a tetrathionate transport term, which
      no document currently has.
  cells_per_g:
    value: 2.36e+12   # the +  is required; YAML reads 2.36e12 as a string
    unit: cells/g dry weight
    meaning: Conversion between the cell count and the dry weight
    status: sourced
    note: >-
      E. coli, interpolated at OUR growth rate. Must NOT be used for
      A. ferrooxidans, which is smaller. Corrected 2026-08-11 from 3.57e12,
      which was a slow-growth value. See ISSUES.md item 33.
    superseded:
      value: 3.57e+12
    source: "params/conversions.yaml :: cells_per_g_dry_weight [S30]"
  biomass:
    value: 4.0
    unit: g dry weight/L
    meaning: Dry cell mass per litre of culture
    status: operating_choice
    note: >-
      Chosen 2026-08-11 to reach Vmax = 14.3, the capacity the retired route
      claimed at 0.1 g/L. A normal aerobic E. coli batch reaches 3 to 5 g/L
      without special effort, so this is not demanding. See the table under
      Vmax for what other biomass levels give.
    source: null
  Vmax:
    value: 80.36
    unit: umol.L^-1.min^-1
    meaning: >-
      Top speed of the whole culture at breaking down tetrathionate,
      = k_cat*[TetH]. At biomass 4.0 g/L.
    status: derived_from_part_II
    derivation: >-
      23301 molecules/cell x 4.0 g/L x 2.36e12 cells/g / 6.022e23
      = 0.3653 umol/L of TetH. Times k_cat 220 /min = 80.36 umol/L/min.
    superseded_2026_08_19:
      value: 9.49
      reason: >-
        The same arithmetic at teth_per_cell = 2749, before Part II's copy
        number moved from 20 to 300. ISSUES.md item 61.
    superseded:
      value: 14.3
      reason: >-
        Used cells_per_g = 3.57e12, a slow-growth value, for a culture the
        model runs at a 35 min doubling. ISSUES.md item 33.
    scales_with_biomass:
      0.1: 2.009
      0.5: 10.045
      1.0: 20.089
      4.0: 80.358
      10.0: 200.895
      30.0: 602.684
    note: >-
      CORRECTED 2026-08-20. The derivation above, this table and the sentence
      below were all left at teth_per_cell = 2749 when the value moved to
      80.36 on 2026-08-19, so the file contradicted itself for a day.
      ISSUES.md item 66.
      About 7x weaker per gram of cells than the retired A. ferrooxidans
      route, because the cells are not built to do this. Biomass is the lever.
      0.71 g/L would give 14.3, the number the retired route claimed at
      0.1 g/L. Biomass is kept at 4.0.
    dimer_ambiguity_cancels: >-
      teth_per_cell counts monomers, so k_cat = 110 /min per subunit is the
      matching pair. 220 /min per dimer with half as many dimers gives the
      identical Vmax. ISSUES.md item 15's factor of 2 does not reach this
      number.
    source: "params/expression.yaml + tetrathionate.k_cat [S1]"
  k_Vmax:
    value: null
    unit: umol.cell^-1.min^-1
    meaning: >-
      Lumped build constant, = k_cat*k_syn. Only needed if the standalone
      enzyme ODE is integrated from an inoculum. The expression route makes
      this unnecessary: Part II's cascade already carries the build-up, with
      growth dilution applied per cell where it belongs. Obtain it with
      src/leach.py :: k_Vmax_from_steady_state(Vmax, X, k_deg, mu) if needed.
    status: derive_at_use
    source: null

  # Retired, kept on the record. Do not use these for E. coli.
  retired_A_ferrooxidans_route:
    status: retired_2026_08_11
    reason: >-
      Wrong organism. These describe a chemolithotroph whose whole energy
      budget runs through tetrathionate. E. coli has no native tetrathionate
      metabolism, so growth yield and maintenance on tetrathionate are not
      defined for it.
    growth_rate_on_tetrathionate:
      value: 0.092
      unit: h^-1
      source: "[S5] Eccleston & Kelly 1978, J. Bacteriol."
    growth_yield:
      value: 12.2
      unit: g dry weight/mol tetrathionate
      source: "[S5] Eccleston & Kelly 1978"
    maintenance_coefficient:
      value: 1.01
      unit: mmol tetrathionate.g^-1.h^-1
      source: "[S5] Eccleston & Kelly 1978"
    specific_demand:
      value: 142.5
      unit: umol.g^-1.min^-1
    Vmax_at_0.1_g_per_L:
      value: 14.3
      unit: umol.L^-1.min^-1

enzyme_production:
  k_syn:
    value: null
    unit: umol.cell^-1.min^-1
    meaning: Enzyme synthesis rate per cell
    status: calibrate
    source: null
    # Not a value. A literature-derived estimate, kept separate so that
    # values() still omits k_syn and a run without it fails loudly.
    # See ISSUES.md items 13 and 14. Prefer lumping k_cat*k_syn instead.
    literature_estimate:
      value: 1.4e-16
      unit: umol.cell^-1.min^-1
      status: derived_from_proxies
      derivation: >-
        (0.28 U/mg crude extract / 2.2 U/mg purified) x protein_per_cell
        / 100 kDa x k_deg. Gives ~77,000 TetH molecules per cell.
      assumed_inputs:
        protein_per_cell:
          value: 1.0e-13
          unit: g/cell
          status: assumed
          note: dominant uncertainty; scales k_syn linearly
      source: >-
        Kanao et al. 2023 J. Biosci. Bioeng. (2.2 +/- 0.37 U/mg purified
        Af-Tth); Protze et al. 2011 Front. Microbiol. (0.28 U/mg in
        tetrathionate-grown cell-free extract, Acidianus ambivalens)
      caveat: >-
        Cross-species: extract activity is archaeal, purified activity is
        Acidithiobacillus. Proxy, not a measurement.
  k_deg:
    value: 1.1e-3
    unit: min^-1
    meaning: Enzyme degradation rate
    status: sourced
    source: "[4] Maurizi 1992"
  mu:
    value: 0.02
    unit: min^-1
    meaning: Growth rate of the host, = ln2/t_double, t_double approx 35 min
    status: adopted_from_part_II
    superseded:
      value: 0.0
      status: sourced
      source: "[3] Alon 2019"
      reason: >-
        The source assumed fixed biomass. The team confirmed the cells grow.
        Same organism as Parts II and III, so the same 1.2 h^-1 = 0.02 min^-1
        applies. ISSUES.md items 12, 29 and 30.
    frame_note: >-
      In the expression route this mu acts INSIDE Part II's per-cell cascade,
      where growth genuinely dilutes an intracellular concentration. It must
      NOT also be applied as -mu*Vmax to the bulk quantity: growing cells
      raise bulk enzyme per litre, they do not lower it. Vmax follows biomass
      through X instead. ISSUES.md item 12.
    source: "params/expression.yaml :: mu"
  X:
    value: null
    unit: cell/L
    meaning: Biomass concentration
    status: input_measured
    source: null

tetrathionate:
  # F_in, the tetrathionate feed rate, was removed on 2026-08-12. There is no
  # feed in a three-vessel process: the broth is charged once into Stage 2 and
  # never topped up. It was always zero; now it does not exist. ISSUES.md 36.
  k_cat:
    value: 220
    unit: min^-1
    meaning: Turnover number of TetH, per 100 kDa dimer
    status: sourced
    source: "[S1] Kanao et al. 2023, J. Biosci. Bioeng."
    derivation: >-
      2.2 +/- 0.37 U/mg, the specific activity of purified Af-Tth expressed in
      A. ferrooxidans. 1 mg of a 100 kDa protein is 0.01 umol, so
      k_cat = 2.2 / 0.01 = 220 /min = 3.7 /s.
    organism_caveat: >-
      THIS IS THE A. FERROOXIDANS FIGURE and our host is E. coli. [S1] reports
      2.5 +/- 0.18 U/mg for the same enzyme acid-refolded from E. coli
      inclusion bodies, which is 250 /min on this dimer basis. The two overlap
      inside their own error bars. Stage 2 does not use this value, it uses
      k_cat_per_subunit below, and gold at 72 h moves 28.49 % to 28.62 %
      across the whole 110 to 250 range. Recorded rather than resolved.
    alternative_value:
      value: 110
      unit: min^-1
      basis: per 50 kDa subunit
      status: sourced
      source: "[S1] Kanao et al. 2023, J. Biosci. Bioeng."
      note: >-
        Use this if each subunit carries its own active site. The sources do
        not settle which is right. Carry both. Factor of 2, no more.
    reconciliation_2026_08_12: >-
      Part I's two models both use 125 min^-1, from 2.5 U/mg on a 50 kDa
      basis. On the face of it that disagrees with the 220 above by 1.76x.
      It does not, or not by much. The 1.76x is two separate factors:
        mass basis        100 kDa dimer vs 50 kDa subunit   = 2.0x
        specific activity 2.2 U/mg vs 2.5 U/mg              = 1.14x
      Put on the same subunit basis, this file says 110 and Part I says 125.
      That is a 14 % disagreement in a measured specific activity, not a
      structural one. Both are kept. See k_cat_per_subunit below, and
      ISSUES.md item 34, which is about a different and much larger split.
  k_cat_per_subunit:
    value: 125
    unit: min^-1
    meaning: Turnover number of TetH, per 50 kDa subunit, Part I's value
    status: sourced
    derivation: >-
      2.5 U/mg, the specific activity [S1] reports for Af-Tth acid-refolded
      from E. coli inclusion bodies, which is our host. 1 mg of a 50 kDa
      subunit is 0.02 umol, so k_cat = 2.5 / 0.02 = 125 /min.
    source: "[S1] Kanao et al. 2023; docs/source/sequential_2026-08-12/"
    note: >-
      THIS IS THE ONE THE SEQUENTIAL STAGE 2 USES, because sequential.E_stage2
      is a concentration of 50 kDa subunits. Pairing it with the 220 dimer
      value would double-count the dimer.
      REPAIRED 2026-08-20. This block carried two derivations, two notes and
      two sources; YAML keeps the last of each silently, so the derivation on
      file described the 220 dimer value and not this one. The 220 material
      now sits on k_cat, where it belongs. ISSUES.md item 66.
      The choice barely matters: gold recovery at 72 h is 28.16 % at 110,
      28.49 % at 125 and 28.62 % at 220. Stage 3 contains no enzyme, so k_cat
      only sets how long Stage 2 takes and how much culture it needs. What it
      does move is the Stage 2 conversion: 85.57 % at 110, 95.94 % at 125 and
      100 % at 220. That is ISSUES.md item 57.
      The source table marks this "unmeasured --- calibrate". That label is
      wrong: specific activity IS k_cat once divided by molar mass. The source
      document is unchanged. See ISSUES.md item 15.
  K_S4O6:
    value: 300
    range: [50, 2400]
    unit: umol/L
    meaning: Michaelis constant
    status: chosen_from_sourced_range
    note: >-
      Chosen 2026-08-12. Part I's author picked 300 from the 50 to 2400
      species range and used it in both models. This closes ISSUES.md item 17,
      which had held the range open with no chosen value.
      The choice barely matters here: tetrathionate
      starts at 23200 umol/L, so the saturating factor is 0.987 at t = 0 and
      Stage 2 runs at Vmax for almost its whole length.
    source: "[2] Kanao 2007, range; docs/source/sequential_2026-08-12/, choice"
  k_par:
    value: 1.20e-5
    unit: L.umol^-1.min^-1
    meaning: >-
      Rate constant for 2Cu(II) + 2S2O3 -> 2Cu(I) + S4O6. Governs BOTH the
      sulfur side (sections 2 and 3) and the copper side (section 5). The
      source table split this into k1 and k3; see ISSUES.md item 16.
    status: sourced_by_proxy
    note: >-
      "increases without NH3". Value supplied 2026-08-12 from both of Part I's
      models, which set k1 = k3 = 1e-5 and so agree with this repository that
      it is one constant.
      THIS IS THE MOST CONSEQUENTIAL NUMBER IN PART I. It destroys 98.2 % of
      the thiosulfate charge in the sequential run. Gold recovery at 72 h is
      100 % at 1e-6, 38.4 % at 1e-5 and 25.8 % at 1e-4. The value is borrowed
      from ammoniacal systems, where ammonia deliberately stabilises Cu(II).
      An ammonia-free system may be substantially faster. Measure it first.
      CHANGED 2026-08-19 from 1.0e-5 to 1.20e-5, the ammonia-free value. The
      note above predicted exactly this: without ammonia competing for Cu(II),
      more Cu(II) is free to attack thiosulfate, so the constant rises. It
      moves together with k_Au_Cu, which fell from 1500 to 21.0 on the same
      day for the same reason. Taking one without the other would put an
      ammoniacal constant and an ammonia-free constant in the same solution.
      This is STILL the most consequential number in Part I, and it is still
      not measured for a waste-PCB feed. ISSUES.md item 54.
    superseded:
      value: 1.0e-5
      reason: >-
        Ammoniacal value, k1 = k3 = 1e-5 in both of Part I's models. Retired
        2026-08-19 with k_Au_Cu when the team chose glycine over ammonia.
    source: "[6] Byerley 1973; [7] Breuer & Jeffrey 2003"
  alkaline_decay_on:
    value: false
    meaning: Whether tetrathionate decomposes in alkali back to thiosulfate
    status: operating_choice
    note: >-
      Added 2026-08-19. FALSE by default, so nothing already reported moves.
      Switch it on deliberately, and only together with pH_balance.pH_set.
      Without it, tetrathionate made by the parasitic reaction is a permanent
      dead end and the pH pump has nothing to act on: pH changes no rate
      anywhere in the model. With it, pH becomes the process lever it is in
      the real vessel.
      IT IS THE LARGEST SINGLE TERM IN THE MODEL and it rests on the least
      certain constant. Read k_alk before switching it on.
    source: "team decision 2026-08-19"
  k_alk:
    value: 16.8
    unit: L.mol^-1.min^-1
    meaning: >-
      Rate constant for 4 S4O6(2-) + 6 OH- -> 5 S2O3(2-) + 2 S3O6(2-) + 3 H2O.
      First order in hydroxide and first order in tetrathionate. Hydroxide is
      in mol/L here, NOT umol/L, because that is the unit the rate was
      measured in; tetrathionate stays in umol/L.
    status: sourced_secondary
    note: >-
      THE WEAKEST NUMBER IN PART I, and the one carrying the most weight.
      Reported range 0.18 to 0.38 L/mol/s; 0.28 is the midpoint, and
      0.28 x 60 = 16.8 L/mol/min in this file's time unit.
      IT HAS NOT BEEN READ IN THE PRIMARY LITERATURE. Rolia & Chakrabarti 1982
      and Zhang & Dreisinger 2002 are both paywalled and every value here came
      through a secondary source. A paper request is open. Do not put a number
      that depends on this in a report until one of those two is read.
      The spread itself is harmless: across the whole 0.18 to 0.38 band the
      final pH moves by about 0.01. What is not harmless is that the constant
      might be wrong by an order of magnitude, or measured at a temperature
      this model does not run at.
    source: "secondary only; primary sources not yet obtained"
  nu_S2_S4:
    value: 1.25
    unit: dimensionless
    meaning: Thiosulfate returned per tetrathionate decomposed, = 5/4
    status: stoichiometric
    note: >-
      NOT FITTED. Read off the balanced equation
      4 S4O6 + 6 OH- -> 5 S2O3 + 2 S3O6 + 3 H2O, and pinned by the sulfur
      audit: 4 = 2 x 1.25 + 3 x 0.50. Changing it breaks conservation, which
      is the point of having it as a named number rather than a literal.
    source: "balanced equation"
  nu_S3_S4:
    value: 0.50
    unit: dimensionless
    meaning: Trithionate produced per tetrathionate decomposed, = 2/4
    status: stoichiometric
    note: >-
      NOT FITTED. Same balanced equation as nu_S2_S4.
      THIS IS WHY THE RETURN LEG IS NOT FREE. Only five of every eight sulfur
      atoms in the decomposed tetrathionate come back as thiosulfate; the
      other three leave as trithionate, which nothing consumes at 25 C. Push
      the pH up and you recycle faster AND you sink sulfur faster.
    source: "balanced equation"
  nu_OH_S4:
    value: 1.50
    unit: dimensionless
    meaning: Hydroxide consumed per tetrathionate decomposed, = 6/4
    status: stoichiometric
    note: "NOT FITTED. Same balanced equation as nu_S2_S4."
    source: "balanced equation"
  trithionate_hydrolysis_on:
    value: false
    meaning: Whether trithionate hydrolyses back towards thiosulfate
    status: operating_choice
    note: >-
      Added 2026-08-19. FALSE by default and it CANNOT be switched on until
      k_tri has a value, because k_tri is null and raises.
      It exists so that k_tri is wired to something. Before this, k_tri was
      declared in this file and read by no code at all: obtaining the 25 C
      value and setting it would have changed nothing, silently. A parameter
      that is ignored is worse than one that raises. Model audit, 2026-08-19.
    source: "team decision 2026-08-19"
  k_tri:
    value: null
    unit: min^-1
    meaning: >-
      Trithionate hydrolysis, S3O6(2-) + H2O -> S2O3(2-) + SO4(2-) + 2 H+.
      FIRST ORDER in trithionate, so the unit is min^-1 and not the
      L.mol^-1.min^-1 this entry carried until 2026-08-19. Unlike the
      tetrathionate route this reaction is not hydroxide-dependent, so there
      is no second concentration in the rate law and no second unit.
    status: unmeasured
    note: >-
      HELD NULL DELIBERATELY, so that using it raises rather than guessing.
      The reported measurements are at 70 to 85 C. There is no 25 C value.
      With no value, trithionate is a terminal sink and the model says so; if
      it turns out to hydrolyse appreciably at 25 C, the sulfur comes back and
      the picture improves for two separate reasons: more thiosulfate, and
      less polythionate handed to GolB.
      CONSEQUENCE OF LEAVING IT NULL: trithionate accumulates. It is not
      bookkeeping, it is where most of the sulfur ends up, and it is the
      species ISSUES.md item 60 is about.
      NOTE THE PROTONS. This route makes two per trithionate. The leach as a
      whole is net base-producing, so the pump is delivering acid; a proton
      source therefore REDUCES the acid demand. Measured: -63,890 umol/L of
      titrant at pH 10.3 without it, -47,079 with k_tri = 1e-4.
    source: null

thiosulfate:
  Y:
    value: 1
    unit: dimensionless
    meaning: Stoichiometric yield (S2O3 per S4O6)
    status: sourced
    source: "[1]"
  V_R:
    value: 1.0
    unit: L
    meaning: Reactor volume
    status: operating_choice
    note: >-
      One litre in both of Part I's models, and the basis every per-litre
      figure in this file is quoted on. Set 2026-08-12.
    source: "docs/source/sequential_2026-08-12/, both write-ups"

gold_leaching:
  rho_Au:
    value: 19300
    unit: kg.m^-3
    meaning: Gold density
    status: sourced
    source: null
  t_film:
    value: 0.5e-6
    range: [0.05e-6, 1.0e-6]
    unit: m
    meaning: Gold plating thickness
    status: team_assumption
    note: >-
      ASSUMED 2026-08-12 by team decision. The feed is mixed electronic waste,
      not boards from a named supplier, so there is no specification to obtain
      and waiting for one was not a real option. 0.5e-6 m is the midpoint of
      the range Part I gives, and it is the value both of Part I's models use.
      THE ASSUMPTION STILL CARRIES THE RESULT. Exposed area goes as 1/t_film,
      so the range is a 20x span in leaching rate. In the full sequential run
      that becomes a 5.2x span in gold recovered at 72 h:
          0.05 um -> 100 %      0.5 um -> 38.4 %      1.0 um -> 19.2 %
      Mixed waste genuinely contains both ends. Immersion-gold surface finishes
      are sub-tenth-micron and cover most of the board area; hard gold on edge
      connectors is around a micron and covers very little of it. What the
      model needs is the area-weighted mean over the actual feed, and 0.5e-6
      is a stated midpoint, not a measurement of that mean.
      Quote recoveries with the assumption named. ISSUES.md item 19 stays open
      for that reason: the number is chosen, the uncertainty is not removed.
    superseded:
      value: null
      reason: >-
        Held null as board_spec until 2026-08-12, waiting for a supplier
        specification that a mixed e-waste feed will never have.
    source: "team assumption; range from docs/source/sequential_2026-08-12/"
  k_Au_O2:
    value: 11.4
    unit: umol.m^-2.min^-1
    meaning: Gold rate constant, O2 route
    status: sourced
    note: >-
      1.9e-7 mol m^-2 s^-1 converted exactly: 1.9e-7 x 60 x 1e6 = 11.4.
      Raised from 11 on 2026-08-12 to match the conversion rather than round
      it. Same measurement, same sources; the change moves nothing.
    superseded:
      value: 11
      reason: "Rounded transcription of the same 1.9e-7 mol m^-2 s^-1."
    source: "[9] Zhang & Nicol 2003; [10] Sitando 2018"
  k_Au_Cu:
    value: 21.0
    unit: umol.m^-2.min^-1
    meaning: Gold rate constant, Cu(II) route, AMMONIA-FREE
    status: sourced
    note: >-
      CHANGED 2026-08-19 from 1500 to 21.0. The 1500 is the ammoniacal value:
      it is measured in solutions where ammonia holds Cu(II) as the
      cupric-tetraammine complex, which is the strong oxidant that makes the
      Cu(II) route fast. This project chose GLYCINE over ammonia on
      2026-08-19, so the ammoniacal constant no longer describes the vessel.
      The ammonia-free value is 21.0.
      CONSEQUENCE: the Cu(II) oxidant route stops mattering. f_Cu peaks near
      0.015, so R_Au is carried essentially entirely by the O2 route and the
      rate curve no longer rises to a Cu(II)-driven peak. Gold at 72 h falls
      from about 41 % to about 29 %. That fall is not a regression; the old
      figure described a reactor this project is not building.
      k_par MUST move with this one. Both describe the same solution.
      See ISSUES.md item 54 for why glycine, not ammonia.
    superseded:
      value: 1500
      reason: >-
        Ammoniacal PCB optimum, adopted 2026-08-12. Retired 2026-08-19 when
        the team chose glycine: ammonia is volatile and would be stripped by
        the air pump, so no ammoniacal constant applies.
      superseded:
        value: null
        reason: "Was held null because only the ratio to k_Au_O2 was published."
    source: "[11] Aylmore & Muir 2001; [12] Maharaj 2024"
  K_O2:
    value: 50
    unit: umol/L
    meaning: O2 half-saturation
    status: sourced
    note: >-
      Was "calibrate (~50)". Part I's author cites [10] for the same 50 in
      both models, so the placeholder label is retired. Value unchanged.
    source: "[10] Sitando 2018"
  K_S2O3:
    value: 3376
    unit: umol/L
    meaning: Thiosulfate half-saturation
    status: sourced
    note: >-
      CHANGED 2026-08-19 from 3900 to 3376. Same measurement, better average.
      K_S2O3 = 1/K_ads with K_ads measured at 172 to 510 M^-1. The top of that
      band is 3.0x the bottom, so the band is MULTIPLICATIVE and its centre is
      the geometric mean, not the arithmetic one:
        geometric  sqrt(172 x 510) = 296 M^-1  ->  K_S2O3 = 3376 umol/L
        arithmetic (172 + 510)/2   = 341 M^-1  ->  K_S2O3 = 2933 umol/L
      Note the 3900 it replaces was the midpoint of the RECIPROCALS
      (1960 and 5800), which is a third and different average again. Three
      defensible centres from one band; the geometric mean of the measured
      quantity is the correct one.
      The change is small: gold at 72 h moves by well under a point.
      ADOPTED 2026-08-12 over this repository's own placeholder. = 1/K_ads,
      with K_ads measured at 172 to 510 M^-1, so the sourced band is 1960 to
      5800 umol/L and 3900 is its midpoint.
      AGENTS.md section 6 step 3 decides this: a sourced value beats a stated
      placeholder. The old 5.0e4 carried `status: calibrate` and the note
      "calibrate (~5e4)", which is a placeholder by its own admission, and it
      sat 8.6x above the top of the measured band.
      This is a 1.5x lever on the headline result. Gold recovery at 72 h in
      the sequential run is 28.49 % at 3376, 28.18 % at 3900 and 19.12 % at
      5e4. Those three were 38.4 % and 22.6 % before the ammonia-free
      constants of ISSUES.md item 54; recomputed 2026-08-20, item 66.
      Pinned by tests/test_leach.py ::
      test_K_S2O3_sourced_value_beat_the_repository_placeholder.
    superseded:
      value: 3900
      reason: >-
        Midpoint of the reciprocal band, adopted 2026-08-12. Retired
        2026-08-19 for the geometric mean of K_ads itself.
      superseded:
        value: 5.0e+4
        status: calibrate
        reason: >-
          A placeholder with no source, 8.6x above the top of the measured
          1/K_ads band. Lost to a sourced value under AGENTS.md section 6.
    source: "[18] Senanayake 2005, J. Colloid Interface Sci. 286, 253"
  K_CuII:
    value: 5.0e+4
    unit: umol/L
    meaning: Cu(II) half-saturation
    status: sourced
    note: >-
      Supplied 2026-08-12. Large by design: gold leaching stays first order in
      Cu(II) up to about 0.15 M, so half-saturation sits at or above that
      scale. Cu(II) never exceeds 829 umol/L in the sequential run, so f_Cu
      stays below 0.017 and the Cu(II) route never approaches its rate
      constant. This is why k_Au_Cu being 132x k_Au_O2 does not make the
      Cu(II) route 132x faster.
    superseded:
      value: null
      reason: "Was held null with status calibrate."
    source: "[12] Maharaj 2024"

copper:
  rho_Cu:
    value: 8960
    unit: kg.m^-3
    meaning: Copper density
    status: sourced
    source: null
  d:
    value: 6.0e-3
    range: [2.0e-3, 6.0e-3]
    unit: m
    meaning: Crushed particle size
    status: operating_choice
    note: >-
      "your feed". 6 mm chosen 2026-08-12, the coarse end of the range.
      COARSER IS BETTER HERE, WHICH IS NOT THE USUAL RULE. Gold recovery at
      72 h is 26.0 % at 2 mm, 33.1 % at 4 mm and 38.4 % at 6 mm. Finer
      crushing exposes more copper, which makes more Cu(II), which destroys
      more thiosulfate. Gold sits in a film whose area does not depend on
      crush size at all, so finer crushing buys gold nothing and costs it the
      leachant. Part I's author left this sweep commented out and the result
      appears in neither write-up. Recorded here 2026-08-12.
    source: "docs/source/sequential_2026-08-12/, operating choice"
  k_Cu_O2:

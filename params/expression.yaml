# Part II — GolB surface site density. Source: "GolB_model_writeup.docx" section 4.
# Values transcribed verbatim. Nothing corrected.
# Unit system: molecules/cell, minutes.

meta:
  part: II
  source: docs/source/GolB_model_writeup.docx
  amount_unit: molecules/cell
  time_unit: min

alpha:
  value: 0.5
  unit: mRNA.min^-1.copy^-1
  meaning: Transcription rate per plasmid copy (promoter strength)
  status: sourced
  source: "Typical E. coli promoter output (BioNumbers)"

N:
  value: 300
  unit: copies/cell
  meaning: Plasmid copy number
  status: sourced_from_an_inconsistent_literature
  range: [75, 700]
  note: >-
    CHANGED 2026-08-19 from 20 to 300. The wet lab confirms a pUC-type
    high-copy backbone, not the pBR322-like one this file assumed.
    THE LITERATURE IS GENUINELY INCONSISTENT. 300-700 and 500-700 are both
    widely quoted, while NEB's own pUC19 datasheet gives about 75 at 37 C.
    300 is a mid-range choice and 75-700 is carried as the honest band.
    SATURATION MAKES THE BAND MATTER LESS THAN IT LOOKS. Because the anchor
    capacity is now co-limiting, a 9.3x spread in N compresses to 3.7x in the
    answer: A = 8,955 at N = 75, 23,301 at 300, 33,533 at 700, and 49,983 at
    infinite copy number. The hard ceiling is f*P_s_max = 50,000 sites, which
    no copy number can pass.
    THIS IS THE CHANGE THAT BROKE THE LINEAR CLOSED FORM. At N = 300 the
    non-saturating form overpredicts surface protein by 87 %; beyond N = 350
    it predicts more protein than the membrane holds. See
    src/expression.py::steady_state_linear.
    VECTOR NAMED 2026-08-20: pJUMP24-1A(sfGFP), for the GolB construct and the
    TetH construct both. pJUMP24 is SEVA AbR #2, kanamycin, with OriV #4,
    pRO1600/ColE1, a pUC-derived module Addgene classifies as high copy, so
    the high-copy classification this value rests on is the right one, and
    TetH shares the plasmid rather than assuming it.
    IT IS A CLASS, NOT A COUNT. Neither Addgene nor the JUMP paper gives
    copies per cell for OriV #4, and this strain has not been measured, so
    300 stays a mid-range choice inside the 75 to 700 band. ISSUES.md item 67.
  superseded:
    value: 20
    reason: >-
      pBR322-like medium-copy assumption, correct until the backbone was
      confirmed. Retired 2026-08-19.
  source: "pJUMP24-1A(sfGFP), OriV #4 pRO1600/ColE1, high copy per Addgene #126971; band from NEB pUC19 datasheet and the autodisplay literature"

delta_m:
  value: 0.20
  unit: min^-1
  meaning: mRNA degradation rate
  status: sourced
  source: "E. coli mRNA half-life approx 2-5 min (t_half approx 3.5 min)"

beta:
  value: 4.0
  unit: protein.min^-1.mRNA^-1
  meaning: Translation rate per mRNA (RBS strength)
  status: sourced
  source: "Typical E. coli translation efficiency (BioNumbers)"

k_sec:
  value: 0.10
  unit: min^-1
  meaning: Export / surface-display rate constant
  status: fitted
  source: "Set by the display scaffold; fitted parameter"

delta_c:
  value: 0.005
  unit: min^-1
  meaning: Cytoplasmic protein degradation
  status: assumed
  source: "approx 0 for a stable protein"

delta_s:
  value: 0.005
  unit: min^-1
  meaning: Surface protein loss
  status: assumed
  source: "Assumed dilution-dominated"

mu:
  value: 0.02
  unit: min^-1
  meaning: Growth (dilution) rate
  status: sourced
  source: "Doubling time approx 35 min (mu = ln2 / t_double)"

f:
  value: 0.5
  unit: dimensionless
  meaning: Fraction folded + gold-accessible
  status: fitted
  source: "Folding/accessibility; fitted parameter"

P_s_max:
  value: 1.0e+5
  unit: sites/cell
  meaning: Maximum surface anchor sites
  status: sourced
  source: "Autodisplay reaches >10^5 molecules/cell (Jose & Meyer)"

K_Au:
  value: 10
  unit: uM
  meaning: GolB-Au(I) dissociation constant
  status: placeholder
  source: "Placeholder -- no clean experimental K_Au; source or fit"
  conflict: "Part III params table lists K_D = 0.1 uM (conservative), sweep 1e-4-0.1. See ISSUES.md item 1."

# Reported steady state from Part II section 5, for regression testing.

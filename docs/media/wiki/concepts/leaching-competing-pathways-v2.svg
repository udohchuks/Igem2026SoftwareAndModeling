<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Thiosulfate is a finite reaction budget</title>
<desc id="dsc">A timed run. Thiosulfate markers leave a vessel of crushed circuit-board fragments. Oxygen oxidises the gold, and the marker leaves as the gold thiosulfate complex; only a trace of the leachant takes that route. Nearly all of it meets copper two, which converts it to tetrathionate and is itself rebuilt from copper one by oxygen, so the loop keeps spending the budget. Two fragments of seven dissolve. When the last marker is spent the routes grey out and the run halts with gold still on the remaining fragments. A bar along the bottom tracks the cycle and its restart.</desc>
<defs>
<linearGradient id="liquor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f4f4"/><stop offset="1" stop-color="#bfe1e1"/></linearGradient>
<clipPath id="clipWaste"><circle cx="760" cy="340" r="38"/></clipPath>
<marker id="aGold" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto"><path class="ar filg" d="M0 0L11 5.5L0 11Z" fill="#b98524"/></marker>
<marker id="aCopper" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto"><path class="ar filc" d="M0 0L11 5.5L0 11Z" fill="#9a6040"/></marker>
<marker id="aViolet" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto"><path class="ar filv" d="M0 0L11 5.5L0 11Z" fill="#8d73a8"/></marker>

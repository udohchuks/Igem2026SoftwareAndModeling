<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470"
     role="img" aria-labelledby="bl-title bl-desc" class="bioleach">
  <title id="bl-title">Bioleaching in three vessels, and the thiosulfate budget</title>
  <desc id="bl-desc">Vessel one grows E. coli and yields purified TetH enzyme;
  the cells stay behind. Vessel two feeds that enzyme tetrathionate and banks
  thiosulfate; with no copper present the charge converts and sulfur is
  conserved. Vessel three adds crushed circuit board to the thiosulfate liquor.
  There the one thiosulfate budget is spent three ways: complexing gold,
  dissolving copper, and hydrolysis. Gold and copper each dissolve by two
  routes, an oxygen route and a copper two plus route. The vessel hands the
  dissolved gold thiosulfate complex to Joint 1.</desc>

  <!-- Colours are plain hex, not CSS custom properties. Inkscape 1.4 ignores
       var() and renders every fill black. Palette: gold #2a78d6,
       copper #eb6834, sulfur #1baf7a. -->
  <style>
    .bioleach   { font-family:"Segoe UI", system-ui, sans-serif; }
    .vessel     { fill:#fcfcfb; stroke:#c3c2b7; stroke-width:1.5; }
    .cap        { fill:#e1e0d9; }
    .vname      { fill:#0b0b0b; font-size:14px; font-weight:600; }
    .vstage     { fill:#898781; font-size:9.5px; letter-spacing:.09em; }
    .lbl        { fill:#52514e; font-size:11.5px; }
    .note       { fill:#898781; font-size:10px; font-style:italic; }
    .tiny       { fill:#898781; font-size:9.5px; }
    .flow       { fill:none; stroke:#c3c2b7; stroke-width:1.6;
                  marker-end:url(#ar); }
    .s-sulfur   { stroke:#1baf7a; marker-end:url(#ar-s); }
    .s-gold     { stroke:#2a78d6; marker-end:url(#ar-g); }
    .t-gold     { fill:#2a78d6; font-size:11.5px; font-weight:600; }
    .t-copper   { fill:#eb6834; font-size:11.5px; font-weight:600; }
    .t-sulfur   { fill:#1baf7a; font-size:11.5px; font-weight:600; }
    .panel      { fill:none; stroke:#e1e0d9; stroke-width:1; }
    .ptitle     { fill:#0b0b0b; font-size:12.5px; font-weight:600; }
    .chip       { fill:#fcfcfb; stroke-width:1.4; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3c2b7"/>
    </marker>
    <marker id="ar-s" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- inputs into vessel 1 -->
  <text class="tiny" x="60" y="42">E. coli · growth medium</text>
  <path class="flow" d="M96,50 V66"/>

  <!-- vessel 1 -->
  <g id="v1">
    <rect class="vessel" x="60" y="70" width="250" height="140" rx="8"/>
    <path class="cap" d="M60,78 a8,8 0 0 1 8,-8 h234 a8,8 0 0 1 8,8 v18 H60 z"/>
    <text class="vstage" x="74" y="86">VESSEL 1</text>
    <text class="vname"  x="74" y="120">Culture</text>
    <text class="lbl"    x="74" y="144">Grow cells, harvest and</text>
    <text class="lbl"    x="74" y="160">purify the TetH enzyme.</text>
    <text class="note"   x="74" y="184">Algebraic, not an ODE.</text>
    <text class="note"   x="74" y="198">The cells stop here.</text>
  </g>

  <text class="lbl" x="322" y="134">TetH</text>
  <path class="flow" d="M312,144 H362"/>

  <!-- vessel 2 -->
  <g id="v2">
    <rect class="vessel" x="365" y="70" width="250" height="140" rx="8"/>
    <path class="cap" d="M365,78 a8,8 0 0 1 8,-8 h234 a8,8 0 0 1 8,8 v18 H365 z"/>
    <text class="vstage" x="379" y="86">VESSEL 2</text>
    <text class="vname"  x="379" y="120">Conversion</text>
    <text class="t-sulfur" x="379" y="146">S₄O₆²⁻ → 2 S₂O₃²⁻</text>
    <text class="lbl"    x="379" y="164">Tetrathionate to thiosulfate.</text>
    <text class="note"   x="379" y="186">No cells and no copper here,</text>
    <text class="note"   x="379" y="200">so sulfur is conserved.</text>
  </g>

  <text class="t-sulfur" x="624" y="134">S₂O₃²⁻</text>
  <path class="flow s-sulfur" d="M617,144 H667"/>

  <!-- inputs into vessel 3 -->
  <text class="tiny" x="670" y="42">crushed circuit board · O₂</text>
  <path class="flow" d="M736,50 V66"/>

  <!-- vessel 3 -->
  <g id="v3">
    <rect class="vessel" x="670" y="70" width="250" height="140" rx="8"/>
    <path class="cap" d="M670,78 a8,8 0 0 1 8,-8 h234 a8,8 0 0 1 8,8 v18 H670 z"/>
    <text class="vstage" x="684" y="86">VESSEL 3</text>
    <text class="vname"  x="684" y="120">Leach</text>
    <text class="lbl"    x="684" y="144">Board meets the liquor.</text>
    <text class="note"   x="684" y="168">No enzyme, so thiosulfate</text>
    <text class="note"   x="684" y="182">has no source. It is a budget,</text>
    <text class="note"   x="684" y="196">charged once and spent.</text>
  </g>

  <!-- output to joint 1 -->
  <path class="flow s-gold" d="M790,212 V236"/>
  <text class="t-gold" x="716" y="252">Au(S₂O₃)₂³⁻</text>
  <text class="tiny"   x="800" y="252">to Joint 1, then capture</text>

  <!-- the budget panel -->
  <rect class="panel" x="60" y="288" width="860" height="152" rx="10"/>
  <text class="ptitle" x="80" y="312">Inside vessel 3: one thiosulfate budget, three claims on it</text>

  <rect class="chip" x="80" y="326" width="150" height="44" rx="6" stroke="#1baf7a"/>
  <text class="t-sulfur" x="94" y="346">S₂O₃²⁻</text>
  <text class="tiny"     x="94" y="360">the whole charge</text>

  <path class="flow s-sulfur" d="M232,343 H286"/>
  <path class="flow s-sulfur" d="M232,352 H268 V385 H286"/>
  <path class="flow s-sulfur" d="M232,360 H250 V423 H286"/>

  <rect class="chip" x="290" y="326" width="286" height="34" rx="6" stroke="#2a78d6"/>
  <text class="t-gold" x="304" y="348">Gold complexed as Au(S₂O₃)₂³⁻</text>
  <text class="tiny" x="592" y="339">two routes: O₂, and Cu(II)</text>
  <text class="tiny" x="592" y="353">the Cu(II) route spends 1 Cu(II) per Au</text>

  <rect class="chip" x="290" y="368" width="286" height="34" rx="6" stroke="#eb6834"/>
  <text class="t-copper" x="304" y="390">Copper dissolved to Cu(I), Cu(II)</text>
  <text class="tiny" x="592" y="381">O₂ route: 2 S₂O₃²⁻ per Cu</text>
  <text class="tiny" x="592" y="395">Cu(II) route: 4 S₂O₃²⁻ per Cu</text>

  <rect class="chip" x="290" y="410" width="286" height="26" rx="6" stroke="#c3c2b7"/>
  <text class="lbl" x="304" y="428">Hydrolysis and trithionate</text>
  <text class="tiny" x="592" y="428">spent, recovering nothing</text>

  <text class="tiny" x="80" y="392">Copper is the</text>
  <text class="tiny" x="80" y="405">competitor here,</text>
  <text class="tiny" x="80" y="418">not a contaminant.</text>
</svg>

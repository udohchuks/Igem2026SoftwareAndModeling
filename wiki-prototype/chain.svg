<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300"
     role="img" aria-labelledby="chain-title chain-desc" class="chain">
  <title id="chain-title">The gold biorecovery chain, nine steps</title>
  <desc id="chain-desc">Crushed printed circuit boards enter at the left. Culture,
  conversion and leach run in three vessels. Joint 1 hands the dissolved gold
  concentration to capture. A separate expression arm supplies the binding site
  count through Joint 2. Elution and reduction follow, ending in the recovered
  metal and the decision summary.</desc>

  <style>
    .chain            { --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
                        --rule: #c3c2b7; --surface: #fcfcfb;
                        --v-leach: #2a78d6; --v-capture: #eb6834; --v-recover: #1baf7a;
                        --joint: #52514e;
                        --st-measured: #0ca30c; --st-assumed: #fab219; --st-blocked: #d03b3b;
                        font-family: "Segoe UI", system-ui, sans-serif; }
    .box              { fill: var(--surface); stroke-width: 1.5; rx: 6; }
    .leach   .box     { stroke: var(--v-leach); }
    .capture .box     { stroke: var(--v-capture); }
    .recover .box     { stroke: var(--v-recover); }
    .gate    .box     { stroke: var(--joint); stroke-dasharray: 4 3; }
    .name             { fill: var(--ink); font-size: 13px; }
    .sub              { fill: var(--muted); font-size: 10.5px; }
    .step             { fill: var(--muted); font-size: 9.5px; letter-spacing: .06em; }
    .flow             { stroke: var(--rule); stroke-width: 1.5; fill: none;
                        marker-end: url(#arrow); }
    .pill             { fill: var(--muted); }
    .pill-mark        { fill: var(--surface); font-size: 9px; font-weight: 600; }
    [data-state="measured"] .pill { fill: var(--st-measured); }
    [data-state="assumed"]  .pill { fill: var(--st-assumed); }
    [data-state="blocked"]  .pill { fill: var(--st-blocked); }
    .band-label       { fill: var(--ink-2); font-size: 10px; letter-spacing: .08em; }
    .band             { fill: none; stroke: var(--rule); stroke-width: 1;
                        stroke-dasharray: 2 4; rx: 10; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3c2b7"/>
    </marker>
  </defs>

  <!-- vessel bands -->
  <rect class="band" x="86" y="52" width="340" height="86"/>
  <text class="band-label" x="96" y="46">BIOLEACHING, THREE VESSELS</text>
  <rect class="band" x="556" y="52" width="340" height="86"/>
  <text class="band-label" x="566" y="46">RECOVERY</text>

  <!-- feedstock -->
  <text class="sub" x="8" y="99">crushed</text>
  <text class="sub" x="8" y="112">PCB</text>
  <path class="flow" d="M62,95 H96"/>

  <!-- main line -->
  <g id="c1" class="leach" data-state="unknown">
    <rect class="box" x="96" y="70" width="98" height="50"/>
    <text class="step" x="104" y="86">STEP 1</text>
    <text class="name" x="104" y="105">Culture</text>
    <circle class="pill" cx="180" cy="83" r="7"/>
    <text class="pill-mark" x="180" y="86.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M194,95 H206"/>

  <g id="c2" class="leach" data-state="unknown">
    <rect class="box" x="206" y="70" width="98" height="50"/>
    <text class="step" x="214" y="86">STEP 2</text>
    <text class="name" x="214" y="105">Conversion</text>
    <circle class="pill" cx="290" cy="83" r="7"/>
    <text class="pill-mark" x="290" y="86.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M304,95 H316"/>

  <g id="c3" class="leach" data-state="unknown">
    <rect class="box" x="316" y="70" width="98" height="50"/>
    <text class="step" x="324" y="86">STEP 3</text>
    <text class="name" x="324" y="105">Leach</text>
    <circle class="pill" cx="400" cy="83" r="7"/>
    <text class="pill-mark" x="400" y="86.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M414,95 H436"/>

  <g id="c4" class="gate" data-state="unknown">
    <rect class="box" x="436" y="70" width="76" height="50"/>
    <text class="step" x="444" y="86">JOINT 1</text>
    <text class="name" x="444" y="105">Au_feed</text>
    <circle class="pill" cx="498" cy="83" r="7"/>
    <text class="pill-mark" x="498" y="86.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M512,95 H566"/>

  <g id="c5" class="capture" data-state="unknown">
    <rect class="box" x="566" y="70" width="98" height="50"/>
    <text class="step" x="574" y="86">STEP 5</text>
    <text class="name" x="574" y="105">Capture</text>
    <circle class="pill" cx="650" cy="83" r="7"/>
    <text class="pill-mark" x="650" y="86.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M664,95 H676"/>

  <g id="c7" class="recover" data-state="unknown">
    <rect class="box" x="676" y="70" width="98" height="50"/>
    <text class="step" x="684" y="86">STEP 7</text>
    <text class="name" x="684" y="105">Elution</text>
    <circle class="pill" cx="760" cy="83" r="7"/>
    <text class="pill-mark" x="760" y="86.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M774,95 H786"/>

  <g id="c8" class="recover" data-state="unknown">
    <rect class="box" x="786" y="70" width="98" height="50"/>
    <text class="step" x="794" y="86">STEP 8</text>
    <text class="name" x="794" y="105">Reduction</text>
    <circle class="pill" cx="870" cy="83" r="7"/>
    <text class="pill-mark" x="870" y="86.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M884,95 H916"/>
  <text class="sub" x="922" y="92">metallic</text>
  <text class="sub" x="922" y="105">gold</text>

  <!-- supply arm: expression feeds the site count into capture through joint 2 -->
  <g id="c6" class="gate" data-state="unknown">
    <rect class="box" x="577" y="190" width="76" height="50"/>
    <text class="step" x="585" y="206">JOINT 2</text>
    <text class="name" x="585" y="225">q_max</text>
    <circle class="pill" cx="639" cy="203" r="7"/>
    <text class="pill-mark" x="639" y="206.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M615,190 V124"/>

  <g id="expression" class="capture" data-state="unknown">
    <rect class="box" x="416" y="190" width="120" height="50"/>
    <text class="step" x="424" y="206">SUPPLY ARM</text>
    <text class="name" x="424" y="225">GolB expression</text>
    <circle class="pill" cx="522" cy="203" r="7"/>
    <text class="pill-mark" x="522" y="206.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M536,215 H573"/>

  <!-- terminal summary -->
  <g id="c9" class="recover" data-state="unknown">
    <rect class="box" x="786" y="190" width="130" height="50"/>
    <text class="step" x="794" y="206">STEP 9</text>
    <text class="name" x="794" y="225">What decides it</text>
    <circle class="pill" cx="902" cy="203" r="7"/>
    <text class="pill-mark" x="902" y="206.5" text-anchor="middle">?</text>
  </g>
  <path class="flow" d="M851,124 V186"/>

  <text class="sub" x="86" y="272">Pill letter and colour carry the evidence state.</text>
  <text class="sub" x="86" y="286">M measured · A assumed · B blocked · ? not yet set</text>
</svg>

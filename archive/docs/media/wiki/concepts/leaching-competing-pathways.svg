<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">How the leachant is depleted during PCB leaching</title>
  <desc id="desc">A small leaching vessel contains a crushed PCB and thiosulfate. Gold gradually appears as dissolved gold thiosulfate while copper cycles from copper one to copper two and converts thiosulfate to tetrathionate. Thiosulfate markers fade to show depletion.</desc>
  <defs>
    <linearGradient id="liquor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff2f2"/><stop offset="1" stop-color="#b9dede"/></linearGradient>
    <marker id="goldArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bd8720"/></marker>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#378f92"/></marker>
    <marker id="violetArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8e70a6"/></marker>
    <style>
      .eyebrow{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:.1em;text-transform:uppercase;fill:#777771}.heading{font:500 21px Georgia,serif;fill:#30302d}.label{font:700 14px Inter,Segoe UI,sans-serif;fill:#343431}.copy{font:400 12px Inter,Segoe UI,sans-serif;fill:#666660}.path{fill:none;stroke-linecap:round;stroke-linejoin:round}.moving{stroke-dasharray:5 10;animation:flow 2.8s linear infinite}.s1{animation:deplete 9s ease-in-out infinite}.s2{animation:deplete 9s .45s ease-in-out infinite}.s3{animation:deplete 9s .9s ease-in-out infinite}.s4{animation:deplete 9s 1.35s ease-in-out infinite}.s5{animation:deplete 9s 1.8s ease-in-out infinite}.s6{animation:deplete 9s 2.25s ease-in-out infinite}.goldProduct{animation:goldAppear 9s ease-in-out infinite}.wasteProduct{animation:wasteAppear 9s ease-in-out infinite}.phase1{animation:phaseOne 9s ease-in-out infinite}.phase2{animation:phaseTwo 9s ease-in-out infinite}.phase3{animation:phaseThree 9s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-30}}@keyframes deplete{0%,24%{opacity:1}72%,92%{opacity:.22}100%{opacity:1}}@keyframes goldAppear{0%,14%{opacity:.35}48%,92%{opacity:1}100%{opacity:.35}}@keyframes wasteAppear{0%,35%{opacity:.3}74%,92%{opacity:1}100%{opacity:.3}}@keyframes phaseOne{0%,27%{opacity:1}34%,100%{opacity:.25}}@keyframes phaseTwo{0%,25%{opacity:.25}35%,66%{opacity:1}74%,100%{opacity:.25}}@keyframes phaseThree{0%,65%{opacity:.25}75%,92%{opacity:1}100%{opacity:.25}}@media(prefers-reduced-motion:reduce){.moving,.s1,.s2,.s3,.s4,.s5,.s6,.goldProduct,.wasteProduct,.phase1,.phase2,.phase3{animation:none}.s1,.s2,.s3,.s4,.s5,.s6,.goldProduct,.wasteProduct,.phase1,.phase2,.phase3{opacity:1}}
    </style>
  </defs>
  <rect width="1000" height="500" fill="#fbfbfa"/>
  <text x="32" y="37" class="eyebrow">Inside the leaching vessel</text><text x="32" y="68" class="heading">Thiosulfate is a finite reaction budget</text><path d="M32 90H968" stroke="#e7e7e2"/>
  <text x="57" y="120" class="copy">THIOSULFATE · CONTROLLED AIR · AMMONIA</text>
  <g transform="translate(55 135)">
    <rect width="390" height="245" rx="26" fill="url(#liquor)" stroke="#9fc9c9"/><path d="M0 54Q195 69 390 54" fill="none" stroke="#86bbbb" stroke-width="2"/>
    <g transform="translate(135 65)"><rect width="125" height="125" rx="14" fill="#315c45"/><path d="M18 27H106M18 62H78M50 62V95H107" fill="none" stroke="#79a686" stroke-width="6" stroke-linecap="round"/><circle cx="18" cy="27" r="8" fill="#d6ae46"/><circle cx="106" cy="27" r="8" fill="#d6ae46"/><circle cx="50" cy="62" r="8" fill="#b97045"/><circle cx="107" cy="95" r="8" fill="#b97045"/><text x="62" y="151" text-anchor="middle" class="label">Crushed PCB</text></g>
    <g fill="#3a9ea1" stroke="#f8fbfa" stroke-width="2"><circle class="s1" cx="55" cy="78" r="10"/><circle class="s2" cx="92" cy="145" r="10"/><circle class="s3" cx="308" cy="88" r="10"/><circle class="s4" cx="337" cy="158" r="10"/><circle class="s5" cx="70" cy="202" r="10"/><circle class="s6" cx="305" cy="213" r="10"/></g>
    <text x="20" y="28" class="label" fill="#277b7f">S₂O₃²⁻</text><text x="80" y="28" class="copy">available leachant</text>
  </g>
  <path d="M445 205C515 177 550 165 610 165" class="path moving" stroke="#bd8720" stroke-width="5" marker-end="url(#goldArrow)"/><text x="490" y="145" class="eyebrow" fill="#94691e">Desired reaction</text>
  <g class="goldProduct" transform="translate(625 120)"><circle cx="64" cy="55" r="52" fill="#fcf5df" stroke="#e3cd91"/><circle cx="42" cy="41" r="12" fill="#d5ae47"/><circle cx="72" cy="29" r="7" fill="#63bfc2"/><circle cx="84" cy="50" r="7" fill="#63bfc2"/><text x="64" y="78" text-anchor="middle" class="label">Dissolved gold</text><text x="64" y="97" text-anchor="middle" class="copy">Au(S₂O₃)₂³⁻</text></g>
  <path d="M445 302C510 324 538 339 585 360" class="path moving" stroke="#a06645" stroke-width="5" marker-end="url(#tealArrow)"/><g transform="translate(588 318)"><circle cx="45" cy="45" r="40" fill="#f4e8e0" stroke="#d3aa91"/><text x="45" y="50" text-anchor="middle" class="label">Cu(I)</text></g>
  <path d="M674 363C747 366 772 322 745 281C726 253 682 251 662 277" class="path moving" stroke="#378f92" stroke-width="4" marker-end="url(#tealArrow)"/><text x="703" y="392" class="copy">O₂ regenerates Cu(II)</text><g transform="translate(605 225)"><circle cx="45" cy="45" r="40" fill="#f1e5de" stroke="#d3aa91"/><text x="45" y="50" text-anchor="middle" class="label">Cu(II)</text></g>
  <path d="M690 270C755 270 795 290 835 318" class="path moving" stroke="#8e70a6" stroke-width="4" marker-end="url(#violetArrow)"/><text x="732" y="248" class="eyebrow" fill="#755a8a">Competing reaction</text>
  <g class="wasteProduct" transform="translate(840 288)"><circle cx="52" cy="52" r="48" fill="#f0eaf4" stroke="#cfbddb"/><text x="52" y="49" text-anchor="middle" class="label">S₄O₆²⁻</text><text x="52" y="69" text-anchor="middle" class="copy">tetrathionate</text></g>
  <path d="M790 414H938" stroke="#d2b870" stroke-width="2" stroke-dasharray="4 7"/><text x="790" y="438" class="label" fill="#8a6b28">NH₃ slows this loss</text>
  <g transform="translate(55 450)"><g class="phase1"><circle cx="5" cy="5" r="5" fill="#3a9ea1"/><text x="17" y="10" class="copy">1 · leachant available</text></g><g class="phase2" transform="translate(250 0)"><circle cx="5" cy="5" r="5" fill="#a06645"/><text x="17" y="10" class="copy">2 · copper redox cycle</text></g><g class="phase3" transform="translate(505 0)"><circle cx="5" cy="5" r="5" fill="#8e70a6"/><text x="17" y="10" class="copy">3 · thiosulfate depleted</text></g></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" role="img" aria-labelledby="title desc">
  <title id="title">How the leachant is depleted during PCB leaching</title>
  <desc id="desc">Thiosulfate dots fade from a small PCB leaching vessel as dissolved gold and tetrathionate appear.</desc>
  <defs>
    <linearGradient id="liquor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff2f2"/><stop offset="1" stop-color="#b9dede"/></linearGradient>
    <marker id="goldArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bd8720"/></marker>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#378f92"/></marker>
    <marker id="violetArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8e70a6"/></marker>
    <style>
      .eyebrow{font:700 10px Inter,Segoe UI,sans-serif;letter-spacing:.08em;text-transform:uppercase;fill:#777771}.heading{font:500 19px Georgia,serif;fill:#30302d}.label{font:700 13px Inter,Segoe UI,sans-serif;fill:#343431}.copy{font:400 11px Inter,Segoe UI,sans-serif;fill:#666660}.path{fill:none;stroke-linecap:round;stroke-linejoin:round}.moving{stroke-dasharray:5 10;animation:flow 2.8s linear infinite}.s1{animation:deplete 9s ease-in-out infinite}.s2{animation:deplete 9s .5s ease-in-out infinite}.s3{animation:deplete 9s 1s ease-in-out infinite}.s4{animation:deplete 9s 1.5s ease-in-out infinite}.s5{animation:deplete 9s 2s ease-in-out infinite}.s6{animation:deplete 9s 2.5s ease-in-out infinite}.goldProduct{animation:goldAppear 9s ease-in-out infinite}.wasteProduct{animation:wasteAppear 9s ease-in-out infinite}.phase1{animation:phaseOne 9s ease-in-out infinite}.phase2{animation:phaseTwo 9s ease-in-out infinite}.phase3{animation:phaseThree 9s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-30}}@keyframes deplete{0%,24%{opacity:1}72%,92%{opacity:.22}100%{opacity:1}}@keyframes goldAppear{0%,14%{opacity:.35}48%,92%{opacity:1}100%{opacity:.35}}@keyframes wasteAppear{0%,35%{opacity:.3}74%,92%{opacity:1}100%{opacity:.3}}@keyframes phaseOne{0%,27%{opacity:1}34%,100%{opacity:.25}}@keyframes phaseTwo{0%,25%{opacity:.25}35%,66%{opacity:1}74%,100%{opacity:.25}}@keyframes phaseThree{0%,65%{opacity:.25}75%,92%{opacity:1}100%{opacity:.25}}@media(prefers-reduced-motion:reduce){.moving,.s1,.s2,.s3,.s4,.s5,.s6,.goldProduct,.wasteProduct,.phase1,.phase2,.phase3{animation:none}.s1,.s2,.s3,.s4,.s5,.s6,.goldProduct,.wasteProduct,.phase1,.phase2,.phase3{opacity:1}}
    </style>
  </defs>
  <rect width="420" height="720" fill="#fbfbfa"/><text x="22" y="30" class="eyebrow">Inside the leaching vessel</text><text x="22" y="58" class="heading">Thiosulfate is a finite reaction budget</text><path d="M22 78H398" stroke="#e7e7e2"/>
  <text x="32" y="104" class="copy">THIOSULFATE · AIR · AMMONIA</text>
  <g transform="translate(30 118)"><rect width="360" height="238" rx="24" fill="url(#liquor)" stroke="#9fc9c9"/><path d="M0 50Q180 64 360 50" fill="none" stroke="#86bbbb" stroke-width="2"/>
    <g transform="translate(120 63)"><rect width="120" height="118" rx="13" fill="#315c45"/><path d="M17 26H102M17 59H75M48 59V91H103" fill="none" stroke="#79a686" stroke-width="6" stroke-linecap="round"/><circle cx="17" cy="26" r="8" fill="#d6ae46"/><circle cx="102" cy="26" r="8" fill="#d6ae46"/><circle cx="48" cy="59" r="8" fill="#b97045"/><circle cx="103" cy="91" r="8" fill="#b97045"/><text x="60" y="142" text-anchor="middle" class="label">Crushed PCB</text></g>
    <g fill="#3a9ea1" stroke="#f8fbfa" stroke-width="2"><circle class="s1" cx="51" cy="78" r="9"/><circle class="s2" cx="82" cy="139" r="9"/><circle class="s3" cx="286" cy="83" r="9"/><circle class="s4" cx="315" cy="145" r="9"/><circle class="s5" cx="62" cy="198" r="9"/><circle class="s6" cx="286" cy="202" r="9"/></g><text x="17" y="27" class="label" fill="#277b7f">S₂O₃²⁻</text><text x="73" y="27" class="copy">available leachant</text>
  </g>
  <path d="M145 356C112 383 99 405 102 429" class="path moving" stroke="#bd8720" stroke-width="5" marker-end="url(#goldArrow)"/><text x="22" y="394" class="eyebrow" fill="#94691e">Desired reaction</text>
  <g class="goldProduct" transform="translate(38 430)"><circle cx="58" cy="51" r="47" fill="#fcf5df" stroke="#e3cd91"/><circle cx="39" cy="38" r="11" fill="#d5ae47"/><circle cx="66" cy="28" r="6" fill="#63bfc2"/><circle cx="78" cy="47" r="6" fill="#63bfc2"/><text x="58" y="70" text-anchor="middle" class="label">Dissolved gold</text><text x="58" y="87" text-anchor="middle" class="copy">Au(S₂O₃)₂³⁻</text></g>
  <path d="M276 356C304 382 307 405 295 430" class="path moving" stroke="#a06645" stroke-width="5" marker-end="url(#tealArrow)"/><text x="236" y="394" class="eyebrow">Copper cycle</text><g transform="translate(247 429)"><circle cx="40" cy="40" r="36" fill="#f4e8e0" stroke="#d3aa91"/><text x="40" y="45" text-anchor="middle" class="label">Cu(I)</text></g>
  <path d="M325 473C363 493 359 532 326 545" class="path moving" stroke="#378f92" stroke-width="4" marker-end="url(#tealArrow)"/><text x="265" y="520" class="copy">O₂ regenerates</text><g transform="translate(245 538)"><circle cx="40" cy="40" r="36" fill="#f1e5de" stroke="#d3aa91"/><text x="40" y="45" text-anchor="middle" class="label">Cu(II)</text></g>
  <path d="M247 583C220 593 196 593 171 575" class="path moving" stroke="#8e70a6" stroke-width="4" marker-end="url(#violetArrow)"/><g class="wasteProduct" transform="translate(70 533)"><circle cx="48" cy="48" r="43" fill="#f0eaf4" stroke="#cfbddb"/><text x="48" y="45" text-anchor="middle" class="label">S₄O₆²⁻</text><text x="48" y="63" text-anchor="middle" class="copy">tetrathionate</text></g>
  <text x="22" y="622" class="copy">NH₃ slows the competing thiosulfate loss.</text><path d="M22 640H398" stroke="#e7e7e2"/>
  <g transform="translate(22 670)"><g class="phase1"><circle cx="4" cy="4" r="4" fill="#3a9ea1"/><text x="14" y="8" class="copy">available</text></g><g class="phase2" transform="translate(120 0)"><circle cx="4" cy="4" r="4" fill="#a06645"/><text x="14" y="8" class="copy">copper cycles</text></g><g class="phase3" transform="translate(265 0)"><circle cx="4" cy="4" r="4" fill="#8e70a6"/><text x="14" y="8" class="copy">depleted</text></g></g>
</svg>

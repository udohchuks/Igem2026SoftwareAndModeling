<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 116" width="1260" height="116"><defs></defs><style>@keyframes tlSweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}.tlFill{transform-box:fill-box;transform-origin:left center;animation:tlSweep 12.0s linear infinite}@keyframes tlRun{from{transform:translateX(0)}to{transform:translateX(1180px)}}.tlHead{animation:tlRun 12.0s linear infinite}</style><rect width="1260" height="116" fill="#faf8f3"/><g transform="translate(40.0,40.0)"><rect x="0" y="0" width="1180" height="2" rx="1" fill="#e3ddd2"/><rect class="tlFill" x="0" y="-1" width="1180" height="4" rx="2" fill="#2d8f94"/><rect x="304.8" y="4" width="1.5" height="9" fill="#e3ddd2"/><text x="304.8333333333333" y="30" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing=".14em" text-anchor="middle" style="fill:#a9a296">GOLD</text><rect x="511.3" y="4" width="1.5" height="9" fill="#e3ddd2"/><text x="511.3333333333333" y="30" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing=".14em" text-anchor="middle" style="fill:#a9a296">COPPER</text><rect x="727.7" y="4" width="1.5" height="9" fill="#e3ddd2"/><text x="727.6666666666666" y="30" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing=".14em" text-anchor="middle" style="fill:#a9a296">THE COPPER CYCLE</text><rect x="1042.3" y="4" width="1.5" height="9" fill="#e3ddd2"/><text x="1042.3333333333333" y="30" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing=".14em" text-anchor="middle" style="fill:#a9a296">LEACHANT SPENT</text><circle class="tlHead" cx="0" cy="1" r="6" fill="#2d8f94"/></g></svg>